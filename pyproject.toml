[project]
name = "tldl"
version = "0.1.0"
description = "Records both sides of a call as two Tracks and turns the Recording into a Transcript."
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.2.0",
    "mlx-whisper>=0.4.3",
    "parakeet-mlx>=0.5.3",
    "silero-vad>=6.2.3",
]

[project.scripts]
tldl = "tldl.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tldl"]
# The capture binary is built by `make` and git-ignored, so it has to be named here to be shipped.
artifacts = ["src/tldl/bin/tldl-capture"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not engine'"
markers = ["engine: slow test of one real Engine on a short audio file; run with `-m engine`"]
